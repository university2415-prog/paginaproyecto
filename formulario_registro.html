<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Comidas Típicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">
                    <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="30" cy="22" r="8" fill="white"/>
                        <path d="M 19 29 L 22 35 L 38 35 L 42 28 Z" fill="white"/>
                        <rect x="16" y="35" width="28" height="3" fill="white"/>
                    </svg>
                </div>
                <h1>Registro de Usuario</h1>
                <p>Crea tu cuenta para explorar las mejores comidas típicas</p>
            </div>

            <form class="login-form" onsubmit="registrarUsuario(event)">
                <label for="name">Nombre</label>
                <input id="name" type="text" placeholder="Tu nombre" required />

                <label for="apellido">Primer apellido</label>
                <input id="apellido" type="text" placeholder="Tu primer apellido" required />

                <label for="apellido2">Segundo apellido</label>
                <input id="apellido2" type="text" placeholder="Tu segundo apellido" />

                <label for="email">Correo</label>
                <input id="email" type="email" placeholder="tu@email.com" required />

                <label for="pass1">Contraseña</label>
                <input id="pass1" type="password" placeholder="••••••••" required />

                <label for="pass2">Repetir Contraseña</label>
                <input id="pass2" type="password" placeholder="••••••••" required />

                <label for="pais">País</label>
                <input id="pais" type="text" placeholder="Tu país" required />

                <button type="submit">Crear usuario 🚀</button>
            </form>

            <p class="signup-text">
                ¿Ya tienes cuenta?
                <a href="index.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <script>
        async function registrarUsuario(event) {
            event.preventDefault();
            const pass1 = document.getElementById('pass1').value;
            const pass2 = document.getElementById('pass2').value;

            if (pass1 !== pass2) {
                alert('Las contraseñas no coinciden. Por favor verifícalas.');
                return;
            }

            const payload = {
                nombre: document.getElementById('name').value,
                primer_apellido: document.getElementById('apellido').value,
                segundo_apellido: document.getElementById('apellido2').value,
                correo: document.getElementById('email').value,
                password: pass1,
                pais: document.getElementById('pais').value
            };

            try {
                        const API_BASE = 'http://localhost:3000';

                        const response = await fetch(API_BASE + '/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();

                if (res.success) {
                    alert('¡Usuario registrado con éxito en la base de datos!');
                    window.location.href = 'menu.html';
                } else {
                    alert(res.message || 'Error al registrar usuario');
                }
            } catch (err) {
                console.error(err);
                alert('Ocurrió un error al procesar la solicitud.');
            }
        }
    </script>
</body>
</html>
