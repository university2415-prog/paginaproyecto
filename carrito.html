<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - Comidas Típicas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="catalog-page">
    <header class="navbar">
      <div class="navbar-content">
        <div class="navbar-brand">
          <div class="brand-logo">
            <svg width="32" height="32" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="30" cy="22" r="8" fill="white"/>
              <path d="M 19 29 L 22 35 L 38 35 L 42 28 Z" fill="white"/>
              <rect x="16" y="35" width="28" height="3" fill="white"/>
            </svg>
          </div>
          <div>
            <h2>Comidas Típicas</h2>
            <p>CATÁLOGO GLOBAL</p>
          </div>
        </div>

        <div class="navbar-actions" style="margin-left: auto;">
          <a href="carrito.html" class="cart-btn">🛒</a>
          <button class="logout-btn" onclick="location.href='logout.php'">Salir</button>
        </div>
      </div>
    </header>

    <main class="cart-page">
      <div class="cart-header">
        <h1>Tu Pedido</h1>
      </div>

      <div id="cartContainer" class="cart-container">
        <div class="empty-cart">
          <div class="empty-cart-content">
            <div class="empty-cart-icon">🛒</div>
            <h2>Tu carrito está vacío</h2>
            <p>Parece que aún no has decidido qué delicias quieres probar.</p>
            <p>¡Vuelve al catálogo y explora nuestros platillos!</p>
            <a href="menu.html" class="btn-explore">Explorar el Menú</a>
          </div>
        </div>
      </div>
    </main>

    <script>
      const dishes = [
        { nombre: 'Tacos al Pastor', price: 12.99, image: 'img/rosti.jpg' },
        { nombre: 'Pizza napolitana', price: 15.99, image: 'img/pizza italiana.jpg' },
        { nombre: 'Sushi Premium', price: 19.99, image: 'img/sushi.jpg' },
        { nombre: 'Chuchitos', price: 12.99, image: 'img/Quiche Lorraine.png' },
        { nombre: 'Goulash Tradicional', price: 14.50, image: 'img/Quiche Lorraine.png' }
      ];

      function obtenerImagenProducto(nombre) {
        const producto = dishes.find(item => item.nombre === nombre);
        return producto ? producto.image : 'img/Quiche Lorraine.png';
      }

      function cargarCarrito() {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let contenedor = document.getElementById('cartContainer');
        if (carrito.length === 0) {
          contenedor.innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-content">
                <div class="empty-cart-icon">🛒</div>
                <h2>Tu carrito está vacío</h2>
                <p>Parece que aún no has decidido qué delicias quieres probar.</p>
                <p>¡Vuelve al catálogo y explora nuestros platillos!</p>
                <a href="menu.html" class="btn-explore">Explorar el Menú</a>
              </div>
            </div>
          `;
          return;
        }
        
        // Agrupar items por nombre
        let carritoAgrupado = {};
        carrito.forEach(item => {
          if (!carritoAgrupado[item.nombre]) {
            carritoAgrupado[item.nombre] = { ...item, cantidad: 1 };
          } else {
            carritoAgrupado[item.nombre].cantidad++;
          }
        });
        
        let items = '';
        let subtotal = 0;
        
        Object.values(carritoAgrupado).forEach((item) => {
          let itemTotal = item.precio * item.cantidad;
          subtotal += itemTotal;
          const imagen = obtenerImagenProducto(item.nombre);
          
          items += `
            <div class="cart-item">
              <div class="item-image">
                <img src="${imagen}" alt="${item.nombre}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block;">
              </div>
              <div class="item-details">
                <h3>${item.nombre}</h3>
                <p class="item-origin"> ${item.nombre.includes('Taco') ? 'México' : item.nombre.includes('Pizza') ? 'Italia' : 'Japón'}</p>
                <p class="item-description">Tradicionales ${item.nombre.toLowerCase()} con ingredientes auténticos.</p>
                <div class="item-controls">
                  <button onclick="cambiarCantidad('${item.nombre}', -1)">−</button>
                  <input type="number" value="${item.cantidad}" readonly />
                  <button onclick="cambiarCantidad('${item.nombre}', 1)">+</button>
                </div>
              </div>
              <div class="item-price">\$${item.precio.toFixed(2)}</div>
              <button class="btn-delete" onclick="eliminarDelCarrito('${item.nombre}')">🗑</button>
            </div>
          `;
        });
        
        const impuestos = subtotal * 0.1;
        const envio = 0;
        const total = subtotal + impuestos + envio;
        
        contenedor.innerHTML = `
          <div class="cart-wrapper">
            <div class="cart-items-section">
              ${items}
            </div>
            <div class="cart-summary-section">
              <div class="summary-card">
                <h2>Resumen del Pedido</h2>
                <div class="summary-row">
                  <span>Subtotal (${carrito.length} items)</span>
                  <span>\$${subtotal.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                  <span>Impuestos y tarifas</span>
                  <span>\$${impuestos.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                  <span>Envío</span>
                  <span class="free">¡Gratis!</span>
                </div>
                <div class="summary-row total">
                  <span>Total</span>
                  <span>\$${total.toFixed(2)}</span>
                </div>
                <button class="btn-checkout" onclick="procesarPago()">Proceder al pago 💳</button>
                <p class="guarantee">⭐ Satisfacción garantizada</p>
              </div>
            </div>
          </div>
        `;
      }
      
      function cambiarCantidad(nombre, cantidad) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let index = carrito.findIndex(item => item.nombre === nombre);

        if (index !== -1) {
          if (cantidad > 0) {
            carrito.push({ nombre, precio: carrito[index].precio, producto_id: carrito[index].producto_id, id: Date.now() });
          } else if (cantidad < 0 && carrito.filter(item => item.nombre === nombre).length > 1) {
            carrito.splice(index, 1);
          }
          localStorage.setItem('carrito', JSON.stringify(carrito));
          cargarCarrito();
        }
      }
      
      function eliminarDelCarrito(nombre) {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        carrito = carrito.filter(item => item.nombre !== nombre);
        localStorage.setItem('carrito', JSON.stringify(carrito));
        cargarCarrito();
      }

      function obtenerItemsAgrupados() {
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const agrupado = {};
        carrito.forEach(item => {
          const key = item.producto_id ? item.producto_id : item.nombre;
          if (!agrupado[key]) {
            agrupado[key] = { producto_id: item.producto_id || 0, nombre: item.nombre, precio: item.precio, cantidad: 0 };
          }
          agrupado[key].cantidad += 1;
        });
        return Object.values(agrupado);
      }

      async function procesarPago() {
        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        if (carrito.length === 0) {
          alert('No hay productos en el carrito. Agrega algo primero.');
          return;
        }

        const items = obtenerItemsAgrupados();
        const subtotal = items.reduce((sum, item) => sum + item.precio * item.cantidad, 0);
        const impuestos = parseFloat((subtotal * 0.1).toFixed(2));
        const total = parseFloat((subtotal + impuestos).toFixed(2));

        try {
          const response = await fetch('guardar_pedido.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items, subtotal, impuestos, total })
          });
          const result = await response.json();

          if (result.success) {
            alert('Tu pedido se guardó correctamente en la base de datos. ID de pedido: ' + result.pedido_id);
            localStorage.setItem('carrito', JSON.stringify([]));
            cargarCarrito();
          } else {
            alert(result.message || 'Error al procesar el pedido.');
          }
        } catch (error) {
          console.error(error);
          alert('Error al conectar con el servidor. Intenta de nuevo más tarde.');
        }
      }
      cargarCarrito();
    </script>
  </body>
</html>
